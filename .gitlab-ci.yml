# ============================================================================
# Wails.Net GitLab CI/CD 配置（GitVersion 驱动版本 + 自动���布）
# ----------------------------------------------------------------------------
# 流水线阶段：prepare → build → test → pack → dist → release
#
# 版本控制：
#   * 版本号由 GitVersion 基于 Git 标签/分支/提交历史自动计算（见 GitVersion.yml）
#   * 计算出的 SemVer 通过 -p:WailsNetVersion 注入到 dotnet 构建，
#     覆盖 Directory.Build.props 中的手动版本（本地开发仍用该手动值）。
#
# 自动发布（release 阶段，仅 tag 触发）：
#   * 将 NuGet 包推送到 GitLab 包 registry（项目级 NuGet 源）
#   * 生成变更日志并创建 GitLab Release
#   * 将三平台自包含构建产物作为 Release 资源附件
#
# Runner 要求：
#   * Windows 作业（build/test/pack/dist-windows）需要已注册且标签为 windows 的 Runner
#     （GitLab.com 共享 Runner 仅 Linux；Windows 作业需自备 Runner）。
#   * Linux 作业（test-linux/dist-linux/release）使用共享 Linux Runner（Docker）。
#   * 若仅有 Linux Runner，可将 Windows 平台测试/构建改为 allow_failure，
#     但 Win32/WebView2 相关测试仍需 Windows 才能运行。
# ============================================================================

stages:
  - prepare
  - build
  - test
  - pack
  - dist
  - release

variables:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  SOLUTION: 'Wails.Net.slnx'
  PACKAGE_OUTPUT: 'artifacts/packages'
  DIST_OUTPUT: 'artifacts/dist'
  SKIP_FRONTEND: 'true'

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    key: '$CI_PROJECT_NAMESPACE-$CI_PROJECT_NAME-nuget'
    paths:
      - ~/.nuget/packages
    policy: pull-push

# ============================================================================
# 阶段 1：GitVersion 计算版本号
# 产出 gitversion.env（dotenv），包含 SemVer / NuGetVersion / AssemblySemVer /
# AssemblySemFileVer / InformationalVersion / MajorMinorPatch / FullSemVer。
# 后续阶段通过 needs 获取这些变量并注入 dotnet 构建。
# ============================================================================
gitversion:
  stage: prepare
  image:
    name: gittools/gitversion:6.0.0-alpine.3.17-7.0
    entrypoint: ['']
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0          # GitVersion 需要完整历史与全部标签
  script:
    - /tools/dotnet-gitversion /output buildserver
    - |
      for v in SemVer NuGetVersion AssemblySemVer AssemblySemFileVer InformationalVersion MajorMinorPatch FullSemVer PreReleaseTag; do
        grep "GitVersion_${v}=" gitversion.properties 2>/dev/null | sed 's/^GitVersion_//' >> gitversion.env || true
      done
    - echo "---- GitVersion ----"
    - cat gitversion.env
  artifacts:
    reports:
      dotenv: gitversion.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# 阶段 2：构建（Windows Runner）
# ============================================================================
build:
  stage: build
  tags: [windows]
  needs: [gitversion]
  script:
    - dotnet restore $env:SOLUTION
    - dotnet build $env:SOLUTION -c Release --no-restore -p:SkipFrontendBuild=$env:SKIP_FRONTEND -p:WailsNetVersion=$env:SemVer
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# 阶段 3：测试
# ============================================================================
test-application:
  stage: test
  tags: [windows]
  needs: [gitversion]
  script:
    - dotnet build tests/Wails.Net.Application.Tests/Wails.Net.Application.Tests.csproj -c Release -p:SkipFrontendBuild=$env:SKIP_FRONTEND -p:WailsNetVersion=$env:SemVer
    - dotnet run --project tests/Wails.Net.Application.Tests/Wails.Net.Application.Tests.csproj --no-build -c Release
    - dotnet build tests/Wails.Net.Cli.Tests/Wails.Net.Cli.Tests.csproj -c Release -p:SkipFrontendBuild=$env:SKIP_FRONTEND -p:WailsNetVersion=$env:SemVer
    - dotnet run --project tests/Wails.Net.Cli.Tests/Wails.Net.Cli.Tests.csproj --no-build -c Release
    - dotnet build tests/Wails.Net.AssetServer.Tests/Wails.Net.AssetServer.Tests.csproj -c Release -p:SkipFrontendBuild=$env:SKIP_FRONTEND -p:WailsNetVersion=$env:SemVer
    - dotnet run --project tests/Wails.Net.AssetServer.Tests/Wails.Net.AssetServer.Tests.csproj --no-build -c Release
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test-windows:
  stage: test
  tags: [windows]
  needs: [gitversion]
  script:
    - dotnet build tests/Wails.Net.Application.Windows.Tests/Wails.Net.Application.Windows.Tests.csproj -c Release -p:SkipFrontendBuild=$env:SKIP_FRONTEND -p:WailsNetVersion=$env:SemVer
    - dotnet run --project tests/Wails.Net.Application.Windows.Tests/Wails.Net.Application.Windows.Tests.csproj --no-build -c Release
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

test-linux:
  stage: test
  needs: [gitversion]
  allow_failure: true     # Linux 原生库环境可能不稳定，允许失败
  before_script:
    - apt-get update && apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 || apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
  script:
    - dotnet build tests/Wails.Net.Application.Linux.Tests/Wails.Net.Application.Linux.Tests.csproj -c Release -p:SkipFrontendBuild=$SKIP_FRONTEND -p:WailsNetVersion=$SemVer
    - dotnet run --project tests/Wails.Net.Application.Linux.Tests/Wails.Net.Application.Linux.Tests.csproj --no-build -c Release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test-android:
  stage: test
  tags: [windows]
  needs: [gitversion]
  allow_failure: true
  script:
    - dotnet workload install android
    - dotnet build tests/Wails.Net.Application.Android.Tests/Wails.Net.Application.Android.Tests.csproj -c Release -p:SkipFrontendBuild=$env:SKIP_FRONTEND -p:WailsNetVersion=$env:SemVer
    - dotnet run --project tests/Wails.Net.Application.Android.Tests/Wails.Net.Application.Android.Tests.csproj --no-build -c Release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# 阶段 4：打包 NuGet（仅 main / tag）
# ============================================================================
pack:
  stage: pack
  tags: [windows]
  needs: [gitversion]
  script:
    - New-Item -ItemType Directory -Force -Path $env:PACKAGE_OUTPUT | Out-Null
    - dotnet pack $env:SOLUTION -c Release -o $env:PACKAGE_OUTPUT -p:SkipFrontendBuild=$env:SKIP_FRONTEND -p:WailsNetVersion=$env:SemVer
    # Templates 不在 slnx 中（NU5017 误报，nupkg 实际已生成），单独打包
    - |
      dotnet pack src/Wails.Net.Templates/Wails.Net.Templates.csproj -c Release -o $env:PACKAGE_OUTPUT -p:WailsNetVersion=$env:SemVer
      if ($LASTEXITCODE -ne 0) { Write-Host "Templates 打包返回非零退出码 $LASTEXITCODE（NU5017 误报，nupkg 已生成）" }
    - Get-ChildItem $env:PACKAGE_OUTPUT -Filter *.nupkg | Format-Table Name, Length
  artifacts:
    paths:
      - artifacts/packages/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# 阶段 5：三平台自包含构建（仅 main / tag）
# ============================================================================
dist-windows:
  stage: dist
  tags: [windows]
  needs: [gitversion, pack]
  script:
    - New-Item -ItemType Directory -Force -Path $env:DIST_OUTPUT | Out-Null
    - dotnet run --project build/Wails.Net.Build -- --target=Dist --platform=windows --rid=all --configuration=Release --output=$env:DIST_OUTPUT --skip-frontend
    # 仅在打标签时上传到 Generic Package Registry，供 Release 关联
    - |
      if ($env:CI_COMMIT_TAG) {
        $zip = "wails-net-windows-$env:CI_COMMIT_TAG.zip"
        Compress-Archive -Path "$env:DIST_OUTPUT/windows/*" -DestinationPath $zip -Force
        curl.exe --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $zip "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/wails-net/$env:CI_COMMIT_TAG/$zip"
      }
  artifacts:
    paths:
      - artifacts/dist/windows/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dist-linux:
  stage: dist
  needs: [gitversion, pack]
  before_script:
    - apt-get update && apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 dpkg-dev rpm zip
  script:
    - mkdir -p $DIST_OUTPUT
    - dotnet run --project build/Wails.Net.Build -- --target=Dist --platform=linux --rid=all --configuration=Release --output=$DIST_OUTPUT --skip-frontend
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        zip -r "wails-net-linux-$CI_COMMIT_TAG.zip" "$DIST_OUTPUT/linux"
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "wails-net-linux-$CI_COMMIT_TAG.zip" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wails-net/${CI_COMMIT_TAG}/wails-net-linux-${CI_COMMIT_TAG}.zip"
      fi
  artifacts:
    paths:
      - artifacts/dist/linux/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dist-android:
  stage: dist
  tags: [windows]
  needs: [gitversion, pack]
  allow_failure: true
  script:
    - dotnet workload install android
    - New-Item -ItemType Directory -Force -Path $env:DIST_OUTPUT | Out-Null
    - dotnet run --project build/Wails.Net.Build -- --target=Dist --platform=android --rid=all --configuration=Release --output=$env:DIST_OUTPUT --skip-frontend
    - |
      if ($env:CI_COMMIT_TAG) {
        $zip = "wails-net-android-$env:CI_COMMIT_TAG.zip"
        Compress-Archive -Path "$env:DIST_OUTPUT/android/*" -DestinationPath $zip -Force
        curl.exe --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $zip "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/wails-net/$env:CI_COMMIT_TAG/$zip"
      }
  artifacts:
    paths:
      - artifacts/dist/android/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# 阶段 6：自动发布（仅 tag）
#   * 推送 NuGet 包到 GitLab 包 registry
#   * 生成变更日志并创建 GitLab Release
#   * 关联三平台自包含构建产物（Generic Package）
# ============================================================================
# 发布 NuGet 包到 GitLab 包 registry（仅 tag，避免重复版本冲突）
publish-nuget:
  stage: release
  needs: [pack]
  variables:
    GIT_STRATEGY: none      # 仅需 pack 产物，无需检出代码
  script:
    - dotnet nuget push "artifacts/packages/*.nupkg" --source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" --api-key "${CI_JOB_TOKEN}" --skip-duplicate
    - dotnet nuget push "artifacts/packages/*.snupkg" --source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" --api-key "${CI_JOB_TOKEN}" --skip-duplicate || true
  rules:
    - if: $CI_COMMIT_TAG

# 创建 GitLab Release（仅 tag）：变更日志 + 关联 NuGet / 三平台自包含构建
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: publish-nuget
    - job: gitversion
    - job: dist-windows
      artifacts: false
    - job: dist-linux
      artifacts: false
    - job: dist-android
      artifacts: false
  variables:
    GIT_DEPTH: 0            # git describe 需要完整历史
  before_script:
    - apk add --no-cache git
  script:
    # 生成变更日志（上一个标签到当前标签）
    - |
      PREV_TAG=$(git describe --tags --abbrev=0 "${CI_COMMIT_TAG}^" 2>/dev/null || true)
      if [ -z "$PREV_TAG" ]; then
        git log --pretty=format:"- %s (%h)" > CHANGELOG.md
      else
        git log "${PREV_TAG}..${CI_COMMIT_TAG}" --pretty=format:"- %s (%h)" > CHANGELOG.md
      fi
      echo "" >> CHANGELOG.md
      echo "" >> CHANGELOG.md
      echo "GitVersion: ${SemVer}（FullSemVer: ${FullSemVer}）" >> CHANGELOG.md
      cat CHANGELOG.md
    # 创建 GitLab Release，关联资产
    - |
      release-cli create \
        --name "Wails.Net $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(cat CHANGELOG.md)" \
        --assets-link "[
          {\"name\":\"NuGet 包 (GitLab 包 registry)\",\"url\":\"${CI_SERVER_URL}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/-/packages\",\"link_type\":\"other\"},
          {\"name\":\"Windows 自包含构建\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wails-net/${CI_COMMIT_TAG}/wails-net-windows-${CI_COMMIT_TAG}.zip\",\"link_type\":\"package\"},
          {\"name\":\"Linux 自包含构建\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wails-net/${CI_COMMIT_TAG}/wails-net-linux-${CI_COMMIT_TAG}.zip\",\"link_type\":\"package\"},
          {\"name\":\"Android APK\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/wails-net/${CI_COMMIT_TAG}/wails-net-android-${CI_COMMIT_TAG}.zip\",\"link_type\":\"package\"}
        ]"
  rules:
    - if: $CI_COMMIT_TAG
