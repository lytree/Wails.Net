# ============================================================================
# Wails.Net GitHub Actions CI/CD 配置
# ----------------------------------------------------------------------------
# 流水线 Jobs：build → test → pack → dist → publish
#   其中 test 分两路：test-frontend（pnpm 工作区，ubuntu）与各 .NET 测试作业（test-application / test-windows / test-linux / test-android）
#
# 运行环境：
#   - windows-latest：构建全部项目、Windows 测试、打包、三平台自包含构建
#   - ubuntu-latest：前端 pnpm 工作区构建与单元测试；Linux 平台测试（需 GTK4 原生库，允许失败）
#
# 触发条件：
#   - push 到任意分支：运行 build → test → pack（仅 main 分支）→ dist
#   - Pull Request：运行 build → test
#   - tag（v*.*.*）：运行完整流水线，包括 publish 到 NuGet.org
#
# 版本号管理（GitVersion 自动计算）：
#   - gitversion 作业读取仓库根目录 GitVersion.yml，按 Git 历史/分支/标签自动算出版本号；
#   - 通过 -p:WailsNetVersion=<SemVer> 注入 build/pack 阶段，覆盖 Directory.Build.props 的默认值；
#   - 打 Git tag（如 v0.1.0-alpha.1）即触发完整流水线，publish 阶段推送 NuGet 包到 nuget.org。
#
# 统一 SDK（Wails.Net.Sdk）：
#   - multi-target net10.0;net10.0-windows10.0.19041.0，根据 TFM 自动选择平台 Bundle
#   - 包含 build/ props/targets，消费者自动导入平台相关 MSBuild 属性
#   - pack 阶段会验证 build/ 目录已正确打包到 nupkg
#
# 多 RID 自包含构建：
#   - dist 阶段调用 cake.cs（Cake 构建脚本），通过 --rid all 一键构建该平台全部架构
#   - Windows: win-x64, win-x86, win-arm64（主构建，必须成功）
#   - Linux:   linux-x64, linux-arm64（交叉编译，允许失败）
#   - Android: android-arm64, android-x64, android-arm（需 Android SDK，允许失败）
# ============================================================================

name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # 标记为 CI 构建，启用 ContinuousIntegrationBuild 与确定性构建
  CI: "true"
  # 解决方案文件
  SOLUTION: "Wails.Net.slnx"
  # 打包输出目录
  PACKAGE_OUTPUT: "artifacts/packages"
  # 自包含构建产物目录
  DIST_OUTPUT: "artifacts/dist"

# ============================================================================
# Job 1：构建（restore + build）
# ============================================================================
# Windows runner 构建全部项目，包括 Linux 平台项目（交叉编译程序集）。
# 构建产物上传为 artifact，供后续 test / pack job 下载使用。
jobs:
  # ==========================================================================
  # Job 0：版本计算（GitVersion）
  # ==========================================================================
  # 仿照 AvaloniaTemplate 的用法：dotnet tool restore 安装仓库根目录 dotnet-tools.json
  # 声明的 GitVersion.Tool，再用 `dotnet gitversion /showvariable <变量> /nocache` 直接读取
  # 单个版本变量（无需解析 JSON，彻底规避 gittools/actions/gitversion/execute@v3 的解析 bug）。
  # 通过 needs.gitversion.outputs.semVer 注入后续 build/pack 阶段。
  gitversion:
    name: 计算版本 (GitVersion)
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
      assemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 拉取全部标签，确保 GitVersion 能基于最近标签计算版本
          fetch-tags: true

      - name: 配置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 配置 Git 安全目录（规避 LibGit2 safe.directory / worktreeConfig 导致的崩溃）
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --unset extensions.worktreeConfig 2>/dev/null || true

      - name: 还原本地工具 (GitVersion.Tool)
        run: dotnet tool restore

      - name: 计算版本
        id: gitversion
        run: |
          {
            echo "semVer=$(dotnet gitversion /showvariable SemVer /nocache)"
            echo "fullSemVer=$(dotnet gitversion /showvariable FullSemVer /nocache)"
            echo "assemblySemVer=$(dotnet gitversion /showvariable AssemblySemVer /nocache)"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version: $(dotnet gitversion /showvariable SemVer /nocache)"

  build:
    name: 构建
    runs-on: windows-latest
    needs: [gitversion]
    env:
      WAILS_NET_VERSION: ${{ needs.gitversion.outputs.semVer }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 解决方案包含 net10.0-android36.0 TFM 项目（Wails.Net.Application.Android / Wails.Net.Demo.Android），
      # 还原/构建前必须安装 android 工作负载，否则 dotnet restore 在评估阶段即失败，
      # 导致整个解决方案的 project.assets.json 均未生成，后续 dotnet build --no-restore 报 NETSDK1004。
      - name: 安装 Android 工作负载
        run: dotnet workload install android

      - name: 还原 NuGet 包（含 Cake SDK）
        run: dotnet restore ${{ env.SOLUTION }}

      - name: 构建解决方案
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -p:SkipFrontendBuild=true -p:WailsNetVersion=${{ env.WAILS_NET_VERSION }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            src/**/bin/Release/
            tests/**/bin/Release/
          retention-days: 1

  # ============================================================================
  # Job 1.5：前端（pnpm 工作区：构建 + 类型检查 + 单元测试）
  # ============================================================================
  # .NET 侧构建统一带 -p:SkipFrontendBuild=true，前端产物不在 build job 里生成，
  # 因此 pnpm 工作区需要独立守门：@wails-net/* 公共包的 tsc 构建与 vitest 单元测试、
  # 以及三个示例（React / Vue JSX / Vue SFC）的 Vite 构建。
  # 缺这一段时前端测试会长期静默失败（历史上确有 2 条断言写错的用例未被发现）。
  test-frontend:
    name: 前端 (构建 + 单元测试)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: 安装依赖（严格按 lockfile）
        run: pnpm install --frozen-lockfile

      # 示例通过 "@wails-net/runtime": "workspace:*" 链接本地包，
      # 必须先构建 packages/*/dist，否则示例的 tsc 报 Cannot find module。
      - name: 构建公共包
        run: pnpm build

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建示例前端
        run: pnpm build:examples

  # ============================================================================
  # Job 2：测试
  # ============================================================================
  # 跨平台测试（Application + CLI + AssetServer），在 Windows runner 上运行
  test-application:
    name: 测试 (Application + CLI + AssetServer)
    runs-on: windows-latest
    needs: build
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: build-output

      # Application 测试（TUnit，使用 dotnet run 而非 dotnet test）
      - name: 运行 Application 测试
        run: dotnet run --project tests/Wails.Net.Application.Tests/Wails.Net.Application.Tests.csproj --no-build -c Release

      # CLI 测试
      - name: 运行 CLI 测试
        run: dotnet run --project tests/Wails.Net.Cli.Tests/Wails.Net.Cli.Tests.csproj --no-build -c Release

      # AssetServer 测试（无平台依赖，与 Application 同 runner）
      - name: 运行 AssetServer 测试
        run: dotnet run --project tests/Wails.Net.AssetServer.Tests/Wails.Net.AssetServer.Tests.csproj --no-build -c Release

  # Windows 平台测试（依赖 Win32 API、注册表、WinForms 剪贴板）
  test-windows:
    name: 测试 (Windows 平台)
    runs-on: windows-latest
    needs: build
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: 运行 Windows 平台测试
        run: dotnet run --project tests/Wails.Net.Application.Windows.Tests/Wails.Net.Application.Windows.Tests.csproj --no-build -c Release

  # Linux 平台测试（依赖 GirCore/GTK4 原生库，需在 Linux runner 上运行）
  test-linux:
    name: 测试 (Linux 平台)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true # Linux 原生库环境可能不稳定，允许失败
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 安装 GTK4 + WebKitGTK 6.0 原生库（Debian/Ubuntu 系）
      - name: 安装 GTK4 + WebKitGTK 原生库
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 || sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # 仅还原 Linux 测试项目及其依赖（不还原整个解决方案）。
      # 解决方案 Wails.Net.slnx 含 net10.0-android36.0 TFM 的 Android 工程，本 Linux runner
      # 未安装 android 工作负载，还原/评估会报 NETSDK1147。Linux 测试仅依赖非 Android 工程。
      - name: 还原 NuGet 包（仅 Linux 测试项目）
        run: dotnet restore tests/Wails.Net.Application.Linux.Tests/Wails.Net.Application.Linux.Tests.csproj

      - name: 构建 Linux 测试项目
        run: dotnet build tests/Wails.Net.Application.Linux.Tests/Wails.Net.Application.Linux.Tests.csproj -c Release

      - name: 运行 Linux 平台测试
        run: dotnet run --project tests/Wails.Net.Application.Linux.Tests/Wails.Net.Application.Linux.Tests.csproj --no-build -c Release

  # Android 平台测试（需 android 工作负载，允许失败）
  test-android:
    name: 测试 (Android 平台)
    runs-on: windows-latest
    needs: build
    continue-on-error: true # Android 工作负载环境可能不稳定，允许失败
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 安装 Android 工作负载（构建 Android 测试必需）
      - name: 安装 Android 工作负载
        run: dotnet workload install android

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: build-output

      # 重新构建 Android 测试项目（之前的构建可能未包含 Android TFM）
      - name: 构建 Android 测试项目
        run: dotnet build tests/Wails.Net.Application.Android.Tests/Wails.Net.Application.Android.Tests.csproj -c Release

      # 该测试项目是 Android 应用形态，dotnet run 需要已连接的设备/模拟器。
      # windows-latest 上没有设备，此前直接在"运行 Android 平台测试"步骤失败
      # （No devices are available for this project），作业长期红灯（虽为
      # continue-on-error）。这里用 .NET Android SDK 自己的 ComputeAvailableDevices
      # 目标做检测：无设备时明确跳过并输出 notice，有设备（如自建 runner）时照常执行。
      # 该测试项目是 Android 应用形态，dotnet run 需要已连接的设备/模拟器，而
      # windows-latest 上没有设备（此前步骤直接失败于 No devices are available，
      # 作业长期红灯，仅靠 continue-on-error 兜着）。
      # 这里不去解析 dotnet/MSBuild 的退出码（其错误语义在 PowerShell 下容易被当成
      # 终止错误，实测会跳过整个判定逻辑），改为直接问 adb：有 device 状态的行才算有设备。
      - name: 检测可用 Android 设备
        id: devices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $adb = $null
          foreach ($candidate in @(
              (Join-Path $env:ANDROID_HOME 'platform-tools\adb.exe'),
              (Join-Path $env:ANDROID_SDK_ROOT 'platform-tools\adb.exe'),
              'C:\Android\android-sdk\platform-tools\adb.exe')) {
            if ($candidate -and (Test-Path $candidate)) { $adb = $candidate; break }
          }

          if (-not $adb) {
            $cmd = Get-Command adb -ErrorAction SilentlyContinue
            if ($cmd) { $adb = $cmd.Source }
          }

          if (-not $adb) {
            Write-Host "::notice title=Android 平台测试::未找到 adb，跳过设备端测试"
            "has_device=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Host "使用 adb: $adb"
          $devices = & $adb devices 2>&1
          Write-Host ($devices -join "`n")

          $online = @($devices | Where-Object { $_ -match '\sdevice$' })
          if ($online.Count -eq 0) {
            Write-Host "::notice title=Android 平台测试::未检测到设备或模拟器，跳过设备端测试（编译验证已由上一步覆盖；设备端行为见 E2E 作业）"
            "has_device=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          Write-Host "检测到 $($online.Count) 台设备"
          "has_device=true" >> $env:GITHUB_OUTPUT
          exit 0

      - name: 运行 Android 平台测试
        if: steps.devices.outputs.has_device == 'true'
        run: dotnet run --project tests/Wails.Net.Application.Android.Tests/Wails.Net.Application.Android.Tests.csproj --no-build -c Release

  # Android E2E 设备端测试（需 Android 模拟器，允许失败）
  # 通过 F# 脚本驱动 adb 完成端到端 UI 测试，验证 Wails.Net 在真实 Android 环境的行为。
  # 替代方案：.NET 10 + TUnit 1.58.0 组合下无开箱即用的 Android 插桩测试方案，
  # 采用 F# 脚本 + adb 不违反 AGENTS.md §4.1（非测试框架）与 §7.5（强制 F# 脚本）。
  test-android-e2e:
    name: 测试 (Android E2E 模拟器)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true # Android 模拟器环境可能不稳定，允许失败
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 安装 Android 工作负载
        run: dotnet workload install android

      # 启用 KVM 硬件加速。android-emulator-runner 在 Linux runner 上的前置要求：
      # /dev/kvm 需对 runner 用户可读写。缺失时模拟器退回 TCG 软件模拟（日志中的
      # "TCG doesn't support requested feature"），启动远超 boot 超时，adb 全程 offline。
      - name: 启用 KVM 硬件加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # 启动 Android 模拟器（API 34, x86_64）并运行 E2E 测试脚本
      - name: 运行 Android E2E 测试
        # v2.38.0 起 action.yml 声明 runs.using: node24，兼容 GitHub Node 24 默认 runner，消除 Node 20 弃用告警
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          script: dotnet fsi tests/Wails.Net.Android.E2E/run-android-e2e.fsx -- --verbose

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-logs
          path: |
            tests/Wails.Net.Android.E2E/**/*.log
            examples/Wails.Net.Demo.Android/bin/Release/**/*.apk
          retention-days: 7

  # ============================================================================
  # Job 3：打包 NuGet 包（仅 main 分支或 tag 触发）
  # ============================================================================
  pack:
    name: 打包 NuGet
    runs-on: windows-latest
    needs: [build, gitversion]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      WAILS_NET_VERSION: ${{ needs.gitversion.outputs.semVer }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 打包解决方案含 net10.0-android TFM 项目，dotnet pack 在评估阶段需 android 工作负载，
      # 否则同样报 NETSDK1004。
      # 关键点（已实测验证）：dotnet pack --no-build 不会执行隐式还原，而 build 作业上传的
      # 构建产物只包含 bin/（不含 obj/），因此本作业必须显式还原以生成 obj/project.assets.json，
      # 否则所有项目都会报 NETSDK1004: Assets file '.../obj/project.assets.json' not found。
      # 注意：dotnet run --no-build 仍会还原（test 作业正常），但 dotnet pack --no-build 不会。
      - name: 安装 Android 工作负载
        run: dotnet workload install android

      - name: 还原 NuGet 包（生成 obj/project.assets.json；pack --no-build 不会自动还原）
        run: dotnet restore ${{ env.SOLUTION }}

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: build-output

      # PackAsTool 项目（src/Wails.Net.Cli）在 dotnet pack 时会隐式执行 Publish：
      # Microsoft.NET.PackTool.targets 里 _PackToolPublishDependency 在非
      # GeneratePackageOnBuild 场景下就等于 Publish，用于把工具实现打包进 tool 包。
      # 而 --no-build 下的 Publish 直接从 obj/Release/<tfm>/ 复制中间产物，build 作业
      # 上传的产物只含 bin/（不含 obj/），于是报
      #   MSB3030: Could not copy the file "obj\Release\net10.0\Wails.Net.Cli.dll"
      # 这里先把 CLI 构建一次补齐 obj。将来新增任何 PackAsTool 项目也需要同样处理。
      - name: 构建 CLI（补齐 PackAsTool 打包所需的 obj 中间产物）
        shell: pwsh
        run: dotnet build src/Wails.Net.Cli/Wails.Net.Cli.csproj -c Release -p:SkipFrontendBuild=true -p:WailsNetVersion=${{ env.WAILS_NET_VERSION }}

      - name: 创建打包输出目录
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ${{ env.PACKAGE_OUTPUT }}

      # 打包所有 src/ 下的可发布项目（slnx 包含 Bundle.Windows / Bundle.Linux / Sdk）
      # --no-restore：依赖上方显式还原，避免重复还原并明确依赖关系
      - name: 打包解决方案
        shell: pwsh
        run: dotnet pack ${{ env.SOLUTION }} -c Release --no-build --no-restore -o ${{ env.PACKAGE_OUTPUT }} -p:SkipFrontendBuild=true -p:WailsNetVersion=${{ env.WAILS_NET_VERSION }}

      # 单独打包 Templates 项目
      # Templates 不在 slnx 中，需单独打包。
      # 曾经此步骤会报 NU5017「既无依赖项也无内容」而必须容忍退出码；根因已定位并修复：
      # 主包本身是完整的，报错来自紧随其后的**符号包**——Directory.Build.props 全局开了
      # IncludeSymbols=true，而模板包 IncludeBuildOutput=false、没有程序集与 PDB，
      # 符号包内容为空即报 NU5017。现已在 Wails.Net.Templates.csproj 关掉 IncludeSymbols，
      # 因此这里不再容忍失败（吞掉退出码会掩盖真实回归）。
      # 仍需显式传 WailsNetVersion：否则该包沿用开发默认值 1.0.0-alpha.1，
      # 与同一次发布的其他包版本号不一致。
      - name: 打包 Templates 项目
        shell: pwsh
        run: dotnet pack src/Wails.Net.Templates/Wails.Net.Templates.csproj -c Release -o ${{ env.PACKAGE_OUTPUT }} -p:WailsNetVersion=${{ env.WAILS_NET_VERSION }}

      # 验证 Templates nupkg 实际生成且包含模板内容
      - name: 验证 Templates 包
        shell: pwsh
        run: |
          $templatesPkg = Get-ChildItem ${{ env.PACKAGE_OUTPUT }} -Filter "Wails.Net.Templates.*.nupkg" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $templatesPkg) { Write-Host "错误：Templates 包未生成"; exit 1 }
          Write-Host "Templates 包已生成: $($templatesPkg.Name)"

          $tempDir = Join-Path $env:TEMP "templates-verify-$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Copy-Item $templatesPkg.FullName -Destination (Join-Path $tempDir "templates.zip")
          Expand-Archive -Path (Join-Path $tempDir "templates.zip") -DestinationPath $tempDir -Force

          # NU5017 是误报，但\"误报\"本身不足以证明包是好的——这里直接确认模板内容在位
          $templateConfig = Join-Path $tempDir "content\App\.template.config\template.json"
          if (-not (Test-Path $templateConfig)) {
            Write-Host "错误：Templates 包缺少 content/App/.template.config/template.json"
            exit 1
          }
          $contentFiles = Get-ChildItem (Join-Path $tempDir "content") -Recurse -File
          Write-Host "Templates 包内容验证通过，content/ 下 $($contentFiles.Count) 个文件"
          Remove-Item -Recurse -Force $tempDir

      # 验证统一 SDK 包（Wails.Net.Sdk）已生成且包含 buildTransitive/ 下的 props/targets
      # 注意路径是 buildTransitive 而不是 build：该包通过
      #   <None Include="buildTransitive\**" PackagePath="buildTransitive\" />
      # 交付 MSBuild 逻辑（buildTransitive 可穿透多项目传递引用）。此前校验写的是
      # build/，属过期断言——只是 pack 一直失败所以从没跑到这一步。
      - name: 验证 Wails.Net.Sdk 包
        shell: pwsh
        run: |
          $sdkPkg = Get-ChildItem ${{ env.PACKAGE_OUTPUT }} -Filter "Wails.Net.Sdk.*.nupkg" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdkPkg) { Write-Host "错误：Wails.Net.Sdk 包未生成"; exit 1 }
          Write-Host "Wails.Net.Sdk 包已生成: $($sdkPkg.Name)"
          # 解压 nupkg（zip 格式）验证 buildTransitive/ 目录存在
          $sdkTempDir = Join-Path $env:TEMP "sdk-verify-$(Get-Random)"
          New-Item -ItemType Directory -Force -Path $sdkTempDir | Out-Null
          Copy-Item $sdkPkg.FullName -Destination (Join-Path $sdkTempDir "sdk.zip")
          Expand-Archive -Path (Join-Path $sdkTempDir "sdk.zip") -DestinationPath $sdkTempDir -Force
          $sdkBuildDir = Join-Path $sdkTempDir "buildTransitive"
          if (-not (Test-Path $sdkBuildDir)) { Write-Host "错误：Wails.Net.Sdk 包未包含 buildTransitive/ 目录"; exit 1 }
          $buildFiles = Get-ChildItem $sdkBuildDir -Recurse -File
          $hasProps = $null -ne (Get-ChildItem $sdkBuildDir -Filter "*.props" -File -ErrorAction SilentlyContinue)
          $hasTargets = $null -ne (Get-ChildItem $sdkBuildDir -Filter "*.targets" -File -ErrorAction SilentlyContinue)
          if (-not ($hasProps -and $hasTargets)) {
            Write-Host "错误：buildTransitive/ 下缺少 .props 或 .targets"
            exit 1
          }
          Write-Host "Wails.Net.Sdk buildTransitive/ 验证通过，包含 $($buildFiles.Count) 个文件:"
          $buildFiles | Format-Table Name, FullName
          Remove-Item -Recurse -Force $sdkTempDir

      - name: 列出生成的包
        shell: pwsh
        run: Get-ChildItem ${{ env.PACKAGE_OUTPUT }} -Filter "*.nupkg" | Format-Table Name, Length

      # 冒烟测试：用本地刚打包的 nupkg 验证 CLI 可作为 dotnet global tool 安装运行。
      # 不依赖 nuget.org 索引（推送后索引有延迟），直接用 --add-source 指向本地包目录。
      - name: 冒烟测试 CLI dotnet tool 安装
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:TEMP 'wails-net-tool-smoke'
          Remove-Item -Recurse -Force $toolPath -ErrorAction SilentlyContinue
          dotnet tool install Wails.Net.Cli --version ${{ env.WAILS_NET_VERSION }} --tool-path $toolPath --add-source ${{ env.PACKAGE_OUTPUT }}
          if ($LASTEXITCODE -ne 0) { Write-Host "CLI tool 安装失败"; exit 1 }
          & "$toolPath/wails-net.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Host "wails-net --version 执行失败"; exit 1 }
          Write-Host "CLI tool 冒烟测试通过：wails-net 可安装可执行"

      - name: 上传包产物
        uses: actions/upload-artifact@v7
        with:
          name: package-output
          path: |
            ${{ env.PACKAGE_OUTPUT }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT }}/*.snupkg
          retention-days: 7

  # ============================================================================
  # Job 4：三平台自包含构建（Windows / Linux / Android）
  # ============================================================================
  # 调用 cake.cs（Cake 构建脚本）统一构建，通过 --rid all 一键构建该平台全部架构。
  # 生成自包含可执行文件，无需终端用户安装 .NET 运行时。
  #   - Windows: win-x64, win-x86, win-arm64 → .exe + .zip
  #   - Linux:   linux-x64, linux-arm64     → 二进制 + .tar.gz
  #   - Android: android-arm64, android-x64, android-arm → .apk
  dist-windows:
    name: 自包含构建 (Windows)
    runs-on: windows-latest
    needs: [pack, gitversion]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      WAILS_NET_VERSION: ${{ needs.gitversion.outputs.semVer }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Dist 流程的 PackTask 会对整个解决方案打包（含 net10.0-android TFM 工程），
      # 需 android 工作负载才能评估/打包 Android 工程，否则 NETSDK1147。
      - name: 安装 Android 工作负载
        run: dotnet workload install android

      - name: 创建构建输出目录
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ${{ env.DIST_OUTPUT }}

      # 调用 Cake 构建 Windows 全部 RID（win-x64, win-x86, win-arm64）
      - name: 构建 Windows 自包含（全部 RID）
        shell: pwsh
        run: dotnet run cake.cs -- --build-version=${{ env.WAILS_NET_VERSION }} --target=Dist --platform=windows --rid=all --configuration=Release --output=${{ env.DIST_OUTPUT }} --skip-frontend

      - name: 列出构建产物
        shell: pwsh
        run: Get-ChildItem ${{ env.DIST_OUTPUT }}/windows -Recurse | Format-Table FullName, Length

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: ${{ env.DIST_OUTPUT }}/windows/
          retention-days: 7

  dist-linux:
    name: 自包含构建 (Linux)
    runs-on: ubuntu-latest
    needs: [pack, gitversion]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      WAILS_NET_VERSION: ${{ needs.gitversion.outputs.semVer }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Dist 流程的 PackTask 会对整个解决方案打包（含 net10.0-android TFM 工程），
      # 需 android 工作负载才能评估/打包 Android 工程，否则 NETSDK1147。
      - name: 安装 Android 工作负载
        run: dotnet workload install android

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libwebkitgtk-6.0-4 dpkg-dev rpm

      - name: 创建构建输出目录
        shell: bash
        run: mkdir -p ${{ env.DIST_OUTPUT }}

      # 调用 Cake 构建 Linux 全部 RID（linux-x64, linux-arm64）
      - name: 构建 Linux 自包含（全部 RID）
        shell: bash
        run: dotnet run cake.cs -- --build-version=${{ env.WAILS_NET_VERSION }} --target=Dist --platform=linux --rid=all --configuration=Release --output=${{ env.DIST_OUTPUT }} --skip-frontend

      - name: 列出构建产物
        shell: bash
        run: find ${{ env.DIST_OUTPUT }}/linux -type f -ls

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: ${{ env.DIST_OUTPUT }}/linux/
          retention-days: 7

  dist-android:
    name: 自包含构建 (Android)
    runs-on: windows-latest
    needs: [pack, gitversion]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true # Android 构建需要完整 Android SDK 配置
    env:
      WAILS_NET_VERSION: ${{ needs.gitversion.outputs.semVer }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 安装 Android 工作负载（构建 APK 必需）
      - name: 安装 Android 工作负载
        run: dotnet workload install android

      - name: 创建构建输出目录
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ${{ env.DIST_OUTPUT }}

      # 调用 Cake 构建 Android 全部 RID（android-arm64, android-x64, android-arm）
      - name: 构建 Android APK（全部 RID）
        shell: pwsh
        run: dotnet run cake.cs -- --build-version=${{ env.WAILS_NET_VERSION }} --target=Dist --platform=android --rid=all --configuration=Release --output=${{ env.DIST_OUTPUT }} --skip-frontend

      - name: 列出构建产物
        shell: pwsh
        run: Get-ChildItem ${{ env.DIST_OUTPUT }}/android -Recurse | Format-Table FullName, Length

      - name: 上传 Android 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: ${{ env.DIST_OUTPUT }}/android/
          retention-days: 7

  # ============================================================================
  # Job 5：发布到 NuGet.org（仅 tag 触发，Trusted Publishing）
  # ============================================================================
  # 通过 NuGet Trusted Publishing（OIDC）发布，无需长期 API Key：
  #   1. NuGet/login@v1 用 GitHub OIDC token 向 nuget.org 换取一次性临时 API key（约 1 小时过期）
  #   2. dotnet nuget push 用临时 key 推送全部 nupkg（含 SDK/CLI/Templates/Bundle 等）
  # 前提：nuget.org → Trusted Publishing 已创建 policy（owner 覆盖全部 Wails.Net.* 包），
  #       指定 Repository=lytree/Wails.Net、Workflow=ci.yml、Environment=nuget-org。
  # 所需 Secret：NUGET_USER（nuget.org 用户名 / profile name，非邮箱）。
  publish-nuget:
    name: 发布到 NuGet.org
    runs-on: windows-latest
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # Trusted Publishing 必需：启用 GitHub OIDC token 颁发
      contents: read
    environment:
      # 与 docs/development/release-guide.md 第 188~198 行的 Trusted Publishing policy 同步：
      #   - nuget.org 侧 policy 绑定 environment = "nuget-org"；
      #   - GitHub 仓库侧 Settings → Environments 需存在同名 "nuget-org"。
      #   - 修改此处必须先在两侧同步调整，否则 OIDC 换 key 步骤会失败（首次发布事故防护）。
      name: nuget-org
      url: https://www.nuget.org/packages/Wails.Net.Sdk
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 下载包产物
        uses: actions/download-artifact@v8
        with:
          name: package-output
          path: ${{ env.PACKAGE_OUTPUT }}

      # Trusted Publishing：用 GitHub OIDC token 向 nuget.org 换取一次性临时 API key（约 1 小时过期）。
      # 无需长期 NUGET_API_KEY secret，仅需 NUGET_USER（nuget.org 用户名，非邮箱）。
      # 前提：已在 nuget.org → Trusted Publishing 创建 policy（指定本仓库 + ci.yml + environment=nuget-org）。
      - name: NuGet 登录（OIDC → 临时 API key）
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      # 遍历所有 nupkg 推送到 nuget.org，使用上一步换取的临时 API key
      - name: 推送 NuGet 包
        shell: pwsh
        run: |
          Get-ChildItem ${{ env.PACKAGE_OUTPUT }} -Filter "*.nupkg" | ForEach-Object {
            Write-Host "推送包: $($_.Name)"
            dotnet nuget push $_.FullName --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

  # ============================================================================
  # Job 6：发布 npm 双包（仅 tag 触发，M4 闭环）
  # ============================================================================
  # 前端双包发布：@wails-net/runtime + 全部 @wails-net/plugin-*（39 个）。
  # 与 publish-nuget 并行；前置版本一致性校验（scripts/verify-versions.mjs，
  # Directory.Build.props 的 WailsNetVersion == 各 package.json version），
  # 不一致即失败，保证 NuGet 与 npm 同版本发布。
  # 认证：NPM_TOKEN secret（npmjs.com 自动化 token，packages 具写权限）。
  publish-npm:
    name: 发布到 npmjs.org
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: 版本一致性校验（WailsNetVersion == 前端包版本）
        run: node scripts/verify-versions.mjs

      - name: 安装依赖并构建全部前端包
        run: |
          pnpm install --no-frozen-lockfile
          pnpm -r build

      - name: 发布前端双包（runtime + 39 插件包）
        run: pnpm -r publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ============================================================================
  # Job 7：发布 GitHub Release（仅 tag 触发）
  # ============================================================================
  # 创建 GitHub Release 并上传全部发布产物，供用户直接从 GitHub 下载：
  #   - NuGet 包（.nupkg / .snupkg）：SDK / CLI / Templates / Bundle 等
  #   - 三平台自包含构建产物：Windows .zip、Linux .tar.gz(.deb/.rpm)、Android .apk
  # 与 publish-nuget 并行：nuget.org 面向 dotnet 工具链消费者，GitHub Release 面向
  # 直接下载二进制的用户。使用预装的 gh CLI 创建 Release 并上传资产。
  publish-github-release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [pack, dist-windows, dist-linux, dist-android, gitversion]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # gh release create 需要 write 权限
    env:
      WAILS_NET_VERSION: ${{ needs.gitversion.outputs.semVer }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下载 NuGet 包产物
        uses: actions/download-artifact@v8
        with:
          name: package-output
          path: artifacts/packages

      - name: 下载 Windows 自包含产物
        uses: actions/download-artifact@v8
        with:
          name: dist-windows
          path: artifacts/dist/windows

      - name: 下载 Linux 自包含产物
        uses: actions/download-artifact@v8
        with:
          name: dist-linux
          path: artifacts/dist/linux

      # Android 构建允许失败（continue-on-error），产物可能不存在，跳过下载
      - name: 下载 Android 自包含产物
        uses: actions/download-artifact@v8
        with:
          name: dist-android
          path: artifacts/dist/android
        continue-on-error: true

      - name: 列出待发布产物
        shell: bash
        run: |
          echo "=== NuGet 包 ==="
          find artifacts/packages -type f \( -name '*.nupkg' -o -name '*.snupkg' \) -ls
          echo "=== 自包含构建产物 ==="
          find artifacts/dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.deb' -o -name '*.rpm' \) -ls

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 创建 Release（若已存在则跳过），自动生成 Release Notes
          gh release create "${{ github.ref_name }}" \
            --title "Wails.Net ${{ env.WAILS_NET_VERSION }}" \
            --generate-notes \
            --verify-tag || echo "Release ${{ github.ref_name }} 已存在，继续上传资产"

      - name: 上传 NuGet 包到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 上传全部 nupkg / snupkg（--clobber 覆盖已存在的同名资产）
          find artifacts/packages -type f \( -name '*.nupkg' -o -name '*.snupkg' \) -print0 |
            xargs -0 gh release upload "${{ github.ref_name }}" --clobber

      - name: 上传三平台构建产物到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 上传 Windows/Linux/Android 自包含产物（zip/tar.gz/apk/deb/rpm）
          find artifacts/dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.deb' -o -name '*.rpm' \) -print0 |
            xargs -0 gh release upload "${{ github.ref_name }}" --clobber
