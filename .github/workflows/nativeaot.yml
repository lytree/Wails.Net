# ============================================================================
# Wails.Net NativeAOT 裁剪发布专项 CI（审计 P2-4）
# ----------------------------------------------------------------------------
# 目标：验证 Wails.Net 核心链（Application / Commands / Manifests / Generator / Cli）
# 在 NativeAOT 裁剪发布下的可编译性与可运行性，守护 AGENTS.md §3.4
# "生产代码禁止运行时反射发现/调用" 的收益：
#   - 绑定/命令调用走源生成器编译期生成的强类型调用器（零反射）；
#   - 平台注册走 [ModuleInitializer] + 显式委托注册；
#   - 因此核心库不依赖反射元数据，可被 NativeAOT 静态裁剪。
#
# 验证对象：Wails.Net.Cli（控制台程序，无 GUI，引用 Application/Generator 全部核心库）。
# 触发：push / PR（与主 CI 一致）。
# 平台矩阵：Windows (win-x64) / Linux (linux-x64) / macOS (osx-arm64)。
# ============================================================================

name: NativeAOT

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CI: "true"
  AOT_OUTPUT: "artifacts/nativeaot"

jobs:
  nativeaot-cli:
    name: NativeAOT 裁剪发布 (CLI, ${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe_name: Wails.Net.Cli.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe_name: Wails.Net.Cli
          - os: macos-latest
            rid: osx-arm64
            exe_name: Wails.Net.Cli
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 缓存 NuGet 包
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-aot-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Linux 上 NativeAOT 依赖 clang 与 zlib 开发头文件（macOS 自带 Xcode clang，
      # Windows 使用 MSVC 链接器，均无需额外安装）。
      # 同时安装 GTK4 + WebKitGTK 6.0 开发库：doctor 冒烟测试在 Linux 上会硬性检查
      # pkg-config gtk4 / webkitgtk-6.0 与 libgtk-4.so.1 等共享库，缺失即退出码 1。
      # 需 -dev 包（提供 .pc 文件供 pkg-config 检测），运行时库随 -dev 依赖一并安装。
      - name: 安装 Linux NativeAOT 依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libgtk-4-dev libwebkitgtk-6.0-dev

      # NativeAOT 裁剪发布 CLI（矩阵 rid：win-x64 / linux-x64 / osx-arm64）。
      # 说明：通过 -p:WailsAot=true 启用（项目级条件属性，避免命令行全局属性沿
      # ProjectReference 传播到 netstandard2.1 分析器项目导致 NETSDK1207）。
      # PublishAot=true 会触发 IL 裁剪与 AOT 编译；若核心库存在未注解的运行时反射，
      # 编译期会产生 IL2xxx 警告并在 TreatWarningsAsErrors 下失败——这正是本 job 的守护目标。
      - name: NativeAOT 裁剪发布 CLI
        shell: pwsh
        run: |
          dotnet publish src/Wails.Net.Cli/Wails.Net.Cli.csproj `
            -c Release -r ${{ matrix.rid }} `
            -p:WailsAot=true `
            -o ${{ env.AOT_OUTPUT }}
          if ($LASTEXITCODE -ne 0) { Write-Host "NativeAOT 发布失败"; exit 1 }

      # 冒烟测试（--version）。注意：publish 输出的可执行文件名为项目名
      # （Windows 带有 .exe 后缀），ToolCommandName=wails-net 仅对 dotnet tool 安装生效。
      - name: 冒烟测试（--version）
        shell: pwsh
        run: |
          $exe = Join-Path ${{ env.AOT_OUTPUT }} "${{ matrix.exe_name }}"
          if (-not (Test-Path $exe)) { Write-Host "错误：AOT 可执行文件未生成"; exit 1 }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { Write-Host "--version 执行失败"; exit 1 }

      - name: 冒烟测试（doctor）
        shell: pwsh
        run: |
          $exe = Join-Path ${{ env.AOT_OUTPUT }} "${{ matrix.exe_name }}"
          & $exe doctor
          if ($LASTEXITCODE -ne 0) { Write-Host "doctor 执行失败"; exit 1 }

      - name: 冒烟测试（generate --commands-manifest）
        shell: pwsh
        run: |
          $exe = Join-Path ${{ env.AOT_OUTPUT }} "${{ matrix.exe_name }}"
          $manifest = Join-Path ${{ runner.temp }} "commands.manifest.json"
          @'
          {"version":"1","generatedAt":"2026-08-15T00:00:00Z","commands":[{"name":"app.greet","requiredCapabilities":[],"anonymous":true,"parameters":[]}]}
          '@ | Set-Content $manifest -Encoding UTF8
          & $exe generate --commands-manifest $manifest --output ${{ runner.temp }}/aot-gen-out
          if ($LASTEXITCODE -ne 0) { Write-Host "generate 执行失败"; exit 1 }
          if (-not (Test-Path (Join-Path ${{ runner.temp }} "aot-gen-out/commands.ts"))) { Write-Host "commands.ts 未生成"; exit 1 }
          Write-Host "generate 冒烟测试通过：commands.ts 已生成"

      # 校验 AOT 输出：不应存在任何托管程序集（.dll）。各平台的原生依赖库
      # （libSkiaSharp / e_sqlite3 / libsodium，后缀 .dll / .so / .dylib）予以豁免。
      - name: 校验 AOT 输出（无托管运行时依赖）
        shell: pwsh
        run: |
          $exe = Join-Path ${{ env.AOT_OUTPUT }} "${{ matrix.exe_name }}"
          # 豁免名单为原生依赖库：Windows 命名无 lib 前缀（e_sqlite3.dll / libsodium.dll），
          # Linux/macOS 带 lib 前缀（libSkiaSharp.so / libe_sqlite3.dylib / libsodium.dylib），
          # 故 (lib)? 必须可选，否则 libe_sqlite3.dylib 会被误判为托管程序集。
          $nativeNames = '^(lib)?(SkiaSharp|e_sqlite3|sodium)'
          $managed = Get-ChildItem ${{ env.AOT_OUTPUT }} -Filter "*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch $nativeNames }
          if ($IsMacOS) {
            $managed += Get-ChildItem ${{ env.AOT_OUTPUT }} -Filter "*.dylib" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch $nativeNames }
          }
          $info = Get-Item $exe
          Write-Host "AOT 可执行文件大小 (${{ matrix.rid }}): $([math]::Round($info.Length / 1MB, 1)) MB"
          if ($managed) { Write-Host "注意：输出目录存在非原生程序集: $(($managed | ForEach-Object { $_.Name }) -join ', ')"; exit 1 }
          else { Write-Host "输出目录无托管 DLL（除原生依赖库）——完整 AOT 裁剪，禁反射收益验证通过 (${{ matrix.rid }})" }

      - name: 上传 AOT 产物
        uses: actions/upload-artifact@v7
        with:
          name: nativeaot-cli-${{ matrix.rid }}
          path: ${{ env.AOT_OUTPUT }}/
          retention-days: 7
