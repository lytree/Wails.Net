# Wails.Net GitVersion 配置
# ----------------------------------------------------------------------------
# 仿照 AvaloniaTemplate 的用法：仓库根目录 dotnet-tools.json 固定 GitVersion.Tool 版本，
# CI 中通过 `dotnet tool restore` 安装本地工具，再用
#   dotnet gitversion /showvariable SemVer /nocache
# 直接读取单个版本变量，无需解析 JSON。
#
# 版本号生成规则（Semantic Versioning 2.0）：
#   - 标签 v1.2.3            → 1.2.3                 (正式发布)
#   - 标签 v1.2.3-alpha.1    → 1.2.3-alpha.1         (预发布)
#   - main 分支提交（v1.2.3 之后）→ 1.2.3.{n}        (补丁递增，稳定线)
#   - develop 分支           → 1.2.3-alpha.{n}
#   - feature/* 分支         → 1.2.3-feature.<name>.{n}
#   - release/* 分支         → 1.2.3-rc.{n}
#   - hotfix/* 分支          → 1.2.3.{n}
#
# 提交消息 bump 规则（+semver: <token>）：
#   breaking / major  → 主版本
#   feature / minor   → 次版本
#   fix / patch       → 修订版本
#   none / skip       → 不递增
#
# 与 CI 集成：.github/workflows/ci.yml 的 gitversion 作业读取 SemVer，
# 通过 -p:WailsNetVersion 注入 build/pack/dist 阶段。

assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch
tag-prefix: '[Vv]'
major-version-bump-message: '\+semver:\s?(breaking|major)'
minor-version-bump-message: '\+semver:\s?(feature|minor)'
patch-version-bump-message: '\+semver:\s?(fix|patch)'
no-bump-message: '\+semver:\s?(none|skip)'
legacy-semver-padding: 0
build-metadata-padding: 0
commits-since-version-source-padding: 0
tag-pre-release-weight: 10000
commit-message-incrementing: Enabled

# 仓库尚无标签时的基线版本（打标签后由标签接管）
next-version: '0.1.0'

branches:
  main:
    regex: ^master$|^main$
    mode: Mainline
    label: ''
    increment: Patch
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false
    is-mainline: true
  develop:
    regex: ^dev(elop)?$
    mode: ContinuousDeployment
    label: alpha
    increment: Minor
    source-branches: ['main']
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false
    is-mainline: false
  feature:
    regex: ^features?[/-]
    mode: ContinuousDelivery
    label: feature.{BranchName}
    increment: Minor
    source-branches: ['develop', 'main']
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false
    is-mainline: false
  release:
    regex: ^releases?[/-]
    mode: ContinuousDelivery
    label: rc
    increment: Patch
    source-branches: ['develop', 'main']
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: true
    is-mainline: false
  hotfix:
    regex: ^hotfix[/-]
    mode: ContinuousDelivery
    label: ''
    increment: Patch
    source-branches: ['main', 'release']
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false
    is-mainline: false
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDelivery
    label: pr
    increment: Inherit
    source-branches: ['develop', 'main']
    prevent-increment-of-merged-branch-version: false
    track-merge-target: false
    tracks-release-branches: false
    is-release-branch: false
    is-mainline: false
